<script>
"use strict";

const VERSION = "0.4.0";
const STORE_KEY = "classtask-v040-state";
const OLD_STORE_KEY = "classtask-v030-state";
const nowISO = () => new Date().toISOString();
const uid = (p="id") => p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip = html => {const d=document.createElement("div");d.innerHTML=html||"";return d.textContent||""};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const fmtDate = v => {
  if(!v) return "No deadline";

function builderAutoMeta(id){

function addBlock(aid,type){

  if(type==="checkbox")Object.assign(b,{prompt:"",choices:["Option 1","Option 2","Option 3","Option 4"],answers:[0]});
  if(type==="short"||type==="long")Object.assign(b,{prompt:"",teacherKey:""});
  if(type==="table")Object.assign(b,{prompt:"Complete the table.",columns:["Column 1","Column 2"],rows:[{id:uid("row"),label:"Row 1"},{id:uid("row"),label:"Row 2"}],teacherKey:""});

function gradeBlock(a,s,b,i){

function aiReview(text){
  const words=(text.toLowerCase().match(/[a-z0-9']+/g)||[]),unique=new Set(words),sentences=(text.match(/[.!?]+/g)||[]).length||1;
  const diversity=words.length?unique.size/words.length:0;
  const phraseHits=["in conclusion","furthermore","moreover","it is important to note","overall"].filter(p=>text.toLowerCase().includes(p)).length;
  let signal=0;
  if(words.length>120&&diversity<.43)signal+=25;
  if(words.length>180)signal+=10;
  if(phraseHits>=2)signal+=18;
  if(words.length/sentences>28)signal+=15;
  if(words.length>60&&/[—;]/.test(text))signal+=5;
  signal=clamp(signal,0,80);
  return {signal,words:words.length,diversity,phraseHits,label:signal>=50?"Review suggested":signal>=25?"Some review signals":"Low heuristic signal"};
}

async function scanQuestionFile(aid,file){
  if(!file)return;const status=document.getElementById("questionScanStatus");if(status)status.textContent=`Scanning ${file.name}…`;
  try{const ext=(file.name.split(".").pop()||"").toLowerCase();let candidates=[];
    if(ext==="json")candidates=questionCandidatesFromJSON(JSON.parse(await file.text()));
    else if(ext==="csv")candidates=questionCandidatesFromCSV(await file.text());
    else if(ext==="html"||ext==="htm"){const doc=new DOMParser().parseFromString(await file.text(),"text/html");candidates=detectQuestionCandidates(doc.body?.innerText||"");}
    else if(["txt","md","markdown"].includes(ext))candidates=detectQuestionCandidates(await file.text());
    else if(ext==="docx"){const arrayBuffer=await file.arrayBuffer();let mammoth;try{mammoth=await import("https://cdn.jsdelivr.net/npm/mammoth@1.8.0/+esm");}catch(e){throw new Error("DOCX reader could not load. Check internet access or export as TXT/HTML.");}const result=await mammoth.extractRawText({arrayBuffer});candidates=detectQuestionCandidates(result.value||"");}
    else if(ext==="pdf"){const bytes=new Uint8Array(await file.arrayBuffer());let pdfjs;try{pdfjs=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.mjs");if(pdfjs.GlobalWorkerOptions)pdfjs.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.worker.mjs";}catch(e){throw new Error("PDF reader could not load. Check internet access or export/copy the PDF as TXT.");}const pdf=await pdfjs.getDocument({data:bytes}).promise;let out="";for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),content=await page.getTextContent();out+=content.items.map(x=>x.str).join(" ")+"\n";}candidates=detectQuestionCandidates(out);}
    else if(ext==="doc")throw new Error("Legacy .DOC scanning is not supported. Save as DOCX, TXT, HTML, or PDF first.");
    else candidates=detectQuestionCandidates(await file.text());
    candidates=candidates.slice(0,250);if(!candidates.length)throw new Error("No likely questions were detected. Try numbered questions or one question per line.");questionImportSession={aid,fileName:file.name,candidates};renderQuestionImportReview();
  }catch(e){console.warn(e);if(status)status.innerHTML=`<span style="color:#842b25"><strong>Scan failed:</strong> ${esc(e.message||String(e))}</span>`;}
}
function questionCandidatesFromJSON(obj){let src=[];if(Array.isArray(obj))src=obj;else if(Array.isArray(obj.questions))src=obj.questions;else if(Array.isArray(obj.blocks))src=obj.blocks;else if(obj.assignment&&Array.isArray(obj.assignment.blocks))src=obj.assignment.blocks;else if(Array.isArray(obj.assignments)&&obj.assignments[0]?.blocks)src=obj.assignments[0].blocks;return src.filter(q=>(q.type||"")!=="reading").map((q,i)=>{const choices=Array.isArray(q.choices)?q.choices.map(String):[],type=["multiple","checkbox","short","long","video"].includes(q.type)?q.type:(choices.length?"multiple":"long");return {prompt:String(q.prompt||q.question||q.text||`Question ${i+1}`),type,choices,answer:Number.isInteger(q.answer)?q.answer:0,answers:Array.isArray(q.answers)?q.answers:[],points:Number(q.points)||1,weight:Number(q.weight)||1,teacherKey:String(q.teacherKey||q.answerText||""),source:"JSON"};}).filter(q=>q.prompt.trim());}
function questionCandidatesFromCSV(text){const rows=text.split(/\r?\n/).filter(x=>x.trim()).map(parseCSVLine);if(!rows.length)return [];const hdr=rows[0].map(x=>x.trim().toLowerCase());return rows.slice(1).map((r,i)=>{const o={};hdr.forEach((h,j)=>o[h]=r[j]||"");const choices=[o.choice1,o.choice2,o.choice3,o.choice4,o.choice5,o.choice6].filter(Boolean),rawType=(o.type||"").toLowerCase(),type=rawType.includes("check")?"checkbox":rawType.includes("short")?"short":rawType.includes("long")?"long":choices.length?"multiple":"long",answerText=o.answer||o.correct||"";let answer=choices.findIndex(x=>String(x).trim()===String(answerText).trim());if(answer<0&&/^\d+$/.test(answerText))answer=Math.max(0,Number(answerText)-1);return {prompt:o.prompt||o.question||`Question ${i+1}`,type,choices,answer:Math.max(0,answer),answers:[],points:Number(o.points)||1,weight:Number(o.weight)||1,teacherKey:choices.length?"":answerText,source:"CSV"};}).filter(q=>q.prompt.trim());}
function detectQuestionCandidates(text){const lines=String(text||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),out=[];let current=null;const qPrefix=/^(?:question\s*)?\d{1,3}\s*[\).:\-]\s*/i,qWord=/^q(?:uestion)?\s*\d{0,3}\s*[:.)\-]\s*/i,choice=/^(?:\(?[A-Ha-h]\)?[\).:\-]|[-•])\s+(.+)$/;const flush=()=>{if(current&&current.prompt.trim())out.push(current);current=null};for(const raw of lines){const cm=raw.match(choice);if(current&&cm){current.choices.push(cm[1].trim());continue}const looksNumbered=qPrefix.test(raw)||qWord.test(raw),looksQuestion=/\?$/.test(raw)&&raw.length<700;if(looksNumbered||looksQuestion){flush();const prompt=raw.replace(qPrefix,"").replace(qWord,"").trim();current={prompt,type:"long",choices:[],answer:0,answers:[],points:1,weight:1,teacherKey:"",source:"scan"};continue}if(current&&current.prompt.length<1200&&current.choices.length===0&&raw.length<350&&!/^[A-Ha-h][\).]/.test(raw)){if(!/[.!?]$/.test(current.prompt))current.prompt+=" "+raw;}}flush();for(const q of out){if(q.choices.length>=2)q.type="multiple";else if(q.prompt.length<=180)q.type="short";else q.type="long";}return out;}
function renderQuestionImportReview(){const session=questionImportSession;if(!session)return;const rows=session.candidates.map((q,i)=>`<div class="importQuestionRow"><div><input class="qiPick" type="checkbox" data-index="${i}" checked></div><div><textarea class="qiPrompt" data-index="${i}">${esc(q.prompt)}</textarea>${q.choices?.length?`<div class="importChoices">${q.choices.map((x,j)=>`${String.fromCharCode(65+j)}. ${x}`).join("\n")}</div>`:""}<div class="smallNote">Detected from ${esc(q.source||session.fileName)}</div></div><div><select class="qiType" data-index="${i}">${["multiple","checkbox","short","long"].map(t=>`<option value="${t}" ${q.type===t?"selected":""}>${t==="multiple"?"Multiple Choice":t==="checkbox"?"Checkbox":t==="short"?"Short Written":"Long Written"}</option>`).join("")}</select></div><div><input class="qiPoints" data-index="${i}" type="number" min="0" max="1000" step=".25" value="${Number(q.points)||1}"></div></div>`).join("");showModal("Review Detected Questions",`<div class="successBox"><strong>${session.candidates.length} candidate question(s) detected</strong> in ${esc(session.fileName)}. Nothing is added until you click Import Selected.</div><div class="toolbar"><button class="btn small" onclick="setAllQuestionImports(true)">Select All</button><button class="btn small" onclick="setAllQuestionImports(false)">Select None</button><span class="muted">Change type, wording, or points before importing.</span></div><div class="importQuestionRow head"><div>Use</div><div>Detected question</div><div>Question type</div><div>Points</div></div><div style="max-height:520px;overflow:auto;border:1px solid #ccc;border-top:0">${rows}</div><div class="notice mt8"><strong>Answer keys:</strong> JSON/CSV keys are preserved when available. Plain documents often do not identify the correct answer reliably, so review imported choices and answers in the Builder.</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="importSelectedQuestions()">Import Selected Questions</button>`);}

function importSelectedQuestions(){const session=questionImportSession;if(!session)return;const a=findAssignment(session.aid);if(!a)return;const picks=[...document.querySelectorAll(".qiPick:checked")];if(!picks.length)return toast("Select at least one detected question.");let added=0;for(const pick of picks){const i=Number(pick.dataset.index),q=session.candidates[i];if(!q)continue;const prompt=document.querySelector(`.qiPrompt[data-index="${i}"]`)?.value.trim()||q.prompt,type=document.querySelector(`.qiType[data-index="${i}"]`)?.value||q.type,points=Math.max(0,Number(document.querySelector(`.qiPoints[data-index="${i}"]`)?.value)||1);let b={id:uid("b"),type,prompt,points,weight:Number(q.weight)||1,required:true,image:null,importSource:session.fileName};if(type==="multiple"){b.choices=(q.choices&&q.choices.length>=2)?q.choices.slice():["Option 1","Option 2","Option 3","Option 4"];b.answer=clamp(Number(q.answer)||0,0,b.choices.length-1);}else if(type==="checkbox"){b.choices=(q.choices&&q.choices.length>=2)?q.choices.slice():["Option 1","Option 2","Option 3","Option 4"];b.answers=Array.isArray(q.answers)?q.answers.filter(x=>x>=0&&x<b.choices.length):[];}else b.teacherKey=q.teacherKey||"";a.blocks.push(b);added++;}a.updatedAt=nowISO();logActivity(`Imported ${added} question(s) into ${a.title} from ${session.fileName}.`);questionImportSession=null;saveState();closeModal();render();toast(`${added} question(s) imported.`);}

function recordIntegrityEvent(type,detail,lock=false){

  const last=s.integrityEvents[s.integrityEvents.length-1];
  if(last&&last.type===type&&Date.now()-new Date(last.time).getTime()<1500)return;
  s.integrityEvents.push({id:uid("int"),type,time:nowISO(),page:Number(s.currentPage||0),detail});
  if(lock&&a.settings.lockOnFullscreenExit){
    s.integrityStatus="pending_review";s.locked=true;s.lockReason=type;s.lockPage=Number(s.currentPage||0);s.lockStartedAt=nowISO();
    logActivity(`Integrity review: ${s.studentName} exited fullscreen during ${a.title} at page ${Number(s.currentPage||0)+1}.`);
    saveState();render();toast("Test Mode paused for teacher review.");
  }else scheduleSave();
}
document.addEventListener("fullscreenchange",()=>{
  const ctx=activeTestDraft();if(!ctx)return;
  if(ctx.a.settings.fullscreenRequired&&!document.fullscreenElement)recordIntegrityEvent("fullscreen_exit","Fullscreen was exited while the Test Mode attempt was active.",true);
});
document.addEventListener("visibilitychange",()=>{
  const ctx=activeTestDraft();if(ctx&&document.hidden)recordIntegrityEvent("tab_hidden","The test page became hidden or the student switched away from it.",false);
});

window.addEventListener("beforeunload",()=>saveState());
importHashShare();
render();

</script>
</body>
