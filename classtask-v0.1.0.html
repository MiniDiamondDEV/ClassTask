<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2d5d8a">
<title>ClassTask 0.1.0</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="4" fill="%232d5d8a"/><path d="M12 15h40v34H12z" fill="white"/><path d="M18 22h28v4H18zm0 9h28v4H18zm0 9h18v4H18z" fill="%232d5d8a"/></svg>'>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9edf1;color:#222;font-family:Arial,Helvetica,sans-serif;font-size:14px}
body{min-width:320px}
a{color:#174f80;text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:Arial,Helvetica,sans-serif;font-size:14px}
button{cursor:pointer}
#siteHeader{background:#2d5d8a;border-bottom:1px solid #173d60;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.headerInner{max-width:1180px;margin:0 auto;display:flex;align-items:center;min-height:56px;padding:0 12px}
.brand{display:flex;align-items:center;font-weight:bold;font-size:22px;color:#fff;text-decoration:none;margin-right:24px}
.brand:hover{text-decoration:none}
.logoMark{width:34px;height:34px;background:#fff;border:1px solid #153f62;margin-right:8px;position:relative}
.logoMark:before,.logoMark:after{content:"";position:absolute;left:7px;right:7px;height:3px;background:#2d5d8a}
.logoMark:before{top:9px;box-shadow:0 7px 0 #2d5d8a,0 14px 0 #2d5d8a}
.headerNav{display:flex;gap:2px;align-self:stretch}
.headerNav button{border:0;border-left:1px solid rgba(255,255,255,.12);background:transparent;color:#fff;padding:0 15px;font-weight:bold}
.headerNav button:hover,.headerNav button.active{background:#214c73}
.headerRight{margin-left:auto;display:flex;align-items:center;gap:8px}
.roleBadge{background:#f6f6f6;color:#333;border:1px solid #bbb;padding:5px 8px;font-size:12px}
.headerRight button{background:#f5f5f5;border:1px solid #c4c4c4;color:#222;padding:7px 10px}
#subnav{background:#f7f7f7;border-bottom:1px solid #c8c8c8}
.subnavInner{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;align-items:center;min-height:38px}
#crumbs{color:#666;font-size:12px}
.saveState{margin-left:auto;font-size:12px;color:#777}
#app{max-width:1180px;margin:18px auto;padding:0 12px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}
.sidebar{background:#f8f8f8;border:1px solid #bbb;align-self:start}
.sideTitle{background:#e2e7eb;border-bottom:1px solid #bbb;padding:10px;font-weight:bold}
.sideNav button{width:100%;display:block;text-align:left;border:0;border-bottom:1px solid #ddd;background:#fff;padding:9px 10px;color:#174f80}
.sideNav button:hover,.sideNav button.active{background:#eaf2f8;color:#111;font-weight:bold}
.content{min-width:0}
.panel{background:#fff;border:1px solid #b8b8b8;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.panelHead{background:linear-gradient(#f8f8f8,#e5e5e5);border-bottom:1px solid #b8b8b8;padding:10px 12px;font-weight:bold;display:flex;align-items:center;gap:8px}
.panelHead h1,.panelHead h2,.panelHead h3{font-size:16px;margin:0}
.panelBody{padding:14px}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.btn{display:inline-block;border:1px solid #9d9d9d;background:linear-gradient(#fff,#e6e6e6);color:#222;padding:7px 10px;border-radius:2px;box-shadow:inset 0 1px 0 #fff}
.btn:hover{background:#f2f2f2;text-decoration:none}
.btn.primary{background:linear-gradient(#4e82b2,#2d5d8a);border-color:#234f75;color:#fff}
.btn.success{background:linear-gradient(#6fa05e,#4d7e3f);border-color:#3d6d31;color:#fff}
.btn.danger{background:linear-gradient(#c75c55,#a43d36);border-color:#8d302b;color:#fff}
.btn.small{padding:4px 7px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border:1px solid #c8c8c8;background:#f8f8f8;padding:12px}
.stat strong{display:block;font-size:23px;color:#2d5d8a}
.stat span{font-size:12px;color:#666}
.formRow{margin-bottom:12px}
.formRow label{font-weight:bold;display:block;margin-bottom:4px}
.formRow .hint{font-size:12px;color:#777;margin-top:4px}
input[type=text],input[type=url],input[type=password],input[type=date],input[type=datetime-local],input[type=number],select,textarea{
width:100%;border:1px solid #aaa;background:#fff;padding:7px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)
}
textarea{min-height:92px;resize:vertical}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:#e9edf1;text-align:left;border:1px solid #bbb;padding:8px;font-size:12px}
td{border:1px solid #ccc;padding:8px;vertical-align:top}
tr:nth-child(even) td{background:#fafafa}
.pill{display:inline-block;padding:2px 6px;border:1px solid #bbb;background:#eee;font-size:11px;border-radius:10px;white-space:nowrap}
.pill.green{background:#e6f2e3;border-color:#9cbc91}
.pill.red{background:#f7e5e3;border-color:#d1a09b}
.pill.blue{background:#e5eef6;border-color:#9eb8ce}
.pill.gold{background:#fff4ce;border-color:#d3b864}
.empty{padding:24px;text-align:center;border:1px dashed #bbb;background:#fafafa;color:#777}
hr{border:0;border-top:1px solid #ddd;margin:16px 0}
.notice{border:1px solid #d4c170;background:#fff9dc;padding:10px;margin-bottom:12px}
.info{border:1px solid #a9c3d6;background:#eef6fb;padding:10px;margin-bottom:12px}
.error{border:1px solid #d39a95;background:#fff0ef;padding:10px;margin-bottom:12px;color:#842b25}
.successBox{border:1px solid #93bd88;background:#eef8eb;padding:10px;margin-bottom:12px;color:#2e5f25}
.builderTop{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
.builderCanvas{border:1px solid #aaa;background:#f6f6f6;padding:12px;min-height:300px}
.builderHelp{border:1px solid #bbb;background:#fff;padding:10px}
.blockCard{border:1px solid #bdbdbd;background:#fff;margin-bottom:10px}
.blockCardHead{background:#e8edf1;border-bottom:1px solid #c2c2c2;padding:7px 9px;display:flex;align-items:center;gap:7px}
.blockCardHead strong{margin-right:auto}
.blockCardBody{padding:10px}
.optionRow{display:grid;grid-template-columns:28px 1fr 70px;gap:6px;align-items:center;margin-bottom:6px}
.dragHandle{font-size:16px;color:#777}
.choiceList{margin:8px 0}
.choiceLine{display:flex;align-items:flex-start;gap:7px;margin:7px 0}
.choiceLine input{margin-top:2px}
.questionPage{background:#fff;border:1px solid #aaa;padding:18px;min-height:390px}
.questionCount{color:#666;font-size:12px;margin-bottom:8px}
.questionPrompt{font-size:17px;font-weight:bold;margin-bottom:14px;white-space:pre-wrap}
.readingBox{font-family:Georgia,serif;line-height:1.6;border:1px solid #bbb;background:#fffffc;padding:16px;white-space:pre-wrap}
.videoBox{border:1px solid #bbb;background:#111;padding:6px;text-align:center}
.videoBox video,.videoBox iframe{max-width:100%;width:720px;height:405px;border:0;background:#000}
.richEditor{border:1px solid #999;background:#fff}
.richTools{background:#eee;border-bottom:1px solid #aaa;padding:5px;display:flex;gap:4px;flex-wrap:wrap}
.richTools button{border:1px solid #aaa;background:#fff;min-width:28px;padding:4px}
.richArea{min-height:42px;padding:8px;outline:none}
.richArea.long{min-height:190px}
.progressBar{height:16px;border:1px solid #999;background:#eee}
.progressBar div{height:100%;background:#668eb2;width:0}
.gradeBig{font-size:36px;font-weight:bold;color:#2d5d8a}
.commentBox{border-left:4px solid #9ab3c7;background:#f4f7f9;padding:10px}
.settingsCats{display:grid;grid-template-columns:190px 1fr;gap:12px}
.settingsMenu button{width:100%;text-align:left;border:1px solid #bbb;border-bottom:0;background:#f7f7f7;padding:8px}
.settingsMenu button:last-child{border-bottom:1px solid #bbb}
.settingsMenu button.active{background:#2d5d8a;color:#fff}
.footer{border-top:1px solid #bbb;background:#f5f5f5;color:#666;margin-top:28px}
.footerInner{max-width:1180px;margin:0 auto;padding:18px 12px;font-size:12px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
.footerLinks a{margin-left:14px}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:40}
.modal{background:#fff;border:1px solid #444;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:0 5px 30px rgba(0,0,0,.45)}
.modalTitle{font-weight:bold;padding:11px 13px;border-bottom:1px solid #bbb;background:#e9edf1}
.modalBody{padding:14px}
.modalFoot{border-top:1px solid #ccc;background:#f4f4f4;padding:10px 14px;display:flex;justify-content:flex-end;gap:7px}
.hidden{display:none!important}
.muted{color:#777}
.right{text-align:right}
.center{text-align:center}
.w100{width:100%}
.mb0{margin-bottom:0}
.mt8{margin-top:8px}
#toast{position:fixed;right:14px;bottom:14px;max-width:320px;background:#222;color:#fff;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:80;display:none}
@media(max-width:800px){
 .layout{grid-template-columns:1fr}
 .sidebar{display:none}
 .headerNav{display:none}
 .builderTop,.grid2,.grid3,.settingsCats{grid-template-columns:1fr}
 .headerRight .roleBadge{display:none}
 .headerInner{min-height:50px}
}
</style>
</head>
<body>
<header id="siteHeader">
  <div class="headerInner">
    <a class="brand" href="#" onclick="go('dashboard');return false"><span class="logoMark"></span>ClassTask</a>
    <div class="headerNav" id="headerNav"></div>
    <div class="headerRight">
      <span class="roleBadge" id="roleBadge">Teacher View</span>
      <button onclick="toggleRole()" id="roleSwitch">Student View</button>
      <button onclick="go('settings')">Settings</button>
    </div>
  </div>
</header>
<div id="subnav"><div class="subnavInner"><div id="crumbs">Home</div><div class="saveState" id="saveState">Saved locally</div></div></div>

<main id="app"></main>

<footer class="footer">
  <div class="footerInner">
    <div><strong>ClassTask</strong> v0.1.0 · Educational assignment workspace · Demo data is stored in this browser.</div>
    <div class="footerLinks">
      <a href="#" onclick="showLegal('terms');return false">Terms of Service</a>
      <a href="#" onclick="showLegal('privacy');return false">Privacy Policy</a>
      <a href="#" onclick="showAbout();return false">About</a>
    </div>
  </div>
</footer>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";

const VERSION = "0.1.0";
const STORE_KEY = "classtask-v010-state";
const CLOUD_KEY = "classtask-v010-cloud";
const nowISO = () => new Date().toISOString();
const uid = (p="id") => p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip = html => {
  const d=document.createElement("div"); d.innerHTML=html||""; return d.textContent||"";
};
const fmtDate = v => {
  if(!v) return "No deadline";
  const d=new Date(v); return isNaN(d) ? v : d.toLocaleString([], {year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let saveTimer=null;
let route="dashboard";
let routeData={};
let state = loadState();

function seedState(){
  const cls = {id:"class_demo", name:"Science 8", period:"Period 2", joinCode:"SCI8A", archived:false};
  const unit = {id:"unit_demo", classId:cls.id, name:"Unit 1: Scientific Method", description:"Observation, variables, evidence, and conclusions.", order:1};
  const a = {
    id:"asn_demo",
    classId:cls.id,
    unitId:unit.id,
    title:"Scientific Method Check-In",
    instructions:"Complete each page. You may use your class notes. Submit before the deadline.",
    status:"published",
    createdAt:nowISO(),
    updatedAt:nowISO(),
    dueAt:new Date(Date.now()+3*86400000).toISOString().slice(0,16),
    points:12,
    settings:{
      attempts:1, shuffleQuestions:false, shuffleChoices:false, releaseMode:"immediate",
      showCorrect:true, showFeedback:true, allowLate:true, tts:true, requireAll:true,
      timerMinutes:0, navigation:"sequential", studentNames:true
    },
    blocks:[
      {id:uid("b"),type:"reading",title:"Reading: Variables",text:"An independent variable is the factor changed by the investigator. A dependent variable is what is measured. Controlled variables are kept the same so the comparison is fair.",points:0},
      {id:uid("b"),type:"multiple",prompt:"Which variable is measured as the result of a change?",choices:["Independent variable","Dependent variable","Controlled variable","Random variable"],answer:1,points:2,required:true},
      {id:uid("b"),type:"checkbox",prompt:"Select all examples of controlled variables in a plant-growth experiment.",choices:["Same soil amount","Same pot size","Different light amount","Same water schedule"],answers:[0,1,3],points:3,required:true},
      {id:uid("b"),type:"short",prompt:"In one or two sentences, explain why controlled variables are useful.",points:3,required:true,teacherKey:"They help make the test fair and isolate the independent variable."},
      {id:uid("b"),type:"long",prompt:"Describe a simple experiment you could perform at home or school. Identify the independent and dependent variables.",points:4,required:true,teacherKey:"Open response."}
    ]
  };
  return {
    role:"teacher",
    profile:{teacherName:"Teacher", studentName:"Demo Student", studentId:"student_demo"},
    classes:[cls],
    units:[unit],
    assignments:[a],
    submissions:[],
    settings:{compact:false, autosave:true, confirmDelete:true, dateFormat:"local", sound:false},
    cloud:{provider:"supabase", projectUrl:"", anonKey:"", table:"classtask_assignments"},
    activity:[{id:uid("act"),time:nowISO(),text:"ClassTask v0.1.0 workspace created."}]
  };
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      return Object.assign(seedState(),parsed);
    }
  }catch(e){ console.warn(e); }
  return seedState();
}
function scheduleSave(){
  if(!state.settings.autosave) return;
  document.getElementById("saveState")?.replaceChildren(document.createTextNode("Saving…"));
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveState,350);
}
function saveState(){
  localStorage.setItem(STORE_KEY,JSON.stringify(state));
  const el=document.getElementById("saveState");
  if(el) el.textContent="Saved "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
function logActivity(text){
  state.activity.unshift({id:uid("act"),time:nowISO(),text});
  state.activity=state.activity.slice(0,100);
  scheduleSave();
}
function toast(text){
  const t=document.getElementById("toast"); t.textContent=text; t.style.display="block";
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",2500);
}
function setRole(r){
  state.role=r; scheduleSave(); route="dashboard"; routeData={}; render();
}
function toggleRole(){ setRole(state.role==="teacher"?"student":"teacher"); }
function go(r,data={}){
  route=r; routeData=data; render(); window.scrollTo(0,0);
}
function render(){
  document.getElementById("roleBadge").textContent=state.role==="teacher"?"Teacher View":"Student View";
  document.getElementById("roleSwitch").textContent=state.role==="teacher"?"Student View":"Teacher View";
  renderHeaderNav();
  const app=document.getElementById("app");
  const side=sidebar();
  let page="";
  if(state.role==="teacher") page=renderTeacherRoute();
  else page=renderStudentRoute();
  app.innerHTML=`<div class="layout">${side}<section class="content">${page}</section></div>`;
  document.getElementById("crumbs").textContent=breadcrumb();
  bindDynamic();
}
function renderHeaderNav(){
  const nav=document.getElementById("headerNav");
  const items=state.role==="teacher"
    ? [["dashboard","Home"],["assignments","Assignments"],["units","Units"],["classes","Classes"],["gradebook","Gradebook"]]
    : [["dashboard","Home"],["studentWork","My Work"],["studentGrades","Grades"],["classes","Classes"]];
  nav.innerHTML=items.map(([r,l])=>`<button class="${route===r?"active":""}" onclick="go('${r}')">${l}</button>`).join("");
}
function sidebar(){
  const items=state.role==="teacher"
    ? [["dashboard","Teacher Home"],["assignments","Assignments"],["builder","Create Assignment"],["units","Units"],["classes","Classes"],["gradebook","Gradebook"],["activity","Activity"],["settings","Settings"]]
    : [["dashboard","Student Home"],["studentWork","Assignments"],["studentGrades","Grades"],["classes","Classes"],["activity","Recent Activity"],["settings","Settings"]];
  return `<aside class="sidebar"><div class="sideTitle">${state.role==="teacher"?"Teacher Tools":"Student Menu"}</div><div class="sideNav">${
    items.map(([r,l])=>`<button class="${route===r?"active":""}" onclick="go('${r}')">${l}</button>`).join("")
  }</div></aside>`;
}
function breadcrumb(){
  const labels={dashboard:"Home",assignments:"Assignments",builder:"Assignment Builder",units:"Units",classes:"Classes",gradebook:"Gradebook",activity:"Activity",settings:"Settings",studentWork:"My Work",studentGrades:"Grades",take:"Assignment",submission:"Submission"};
  return `${state.role==="teacher"?"Teacher":"Student"} › ${labels[route]||"Page"}`;
}
function renderTeacherRoute(){
  switch(route){
    case "assignments": return teacherAssignments();
    case "builder": return assignmentBuilder(routeData.id);
    case "units": return teacherUnits();
    case "classes": return classesPage();
    case "gradebook": return gradebook();
    case "submission": return gradeSubmission(routeData.id);
    case "activity": return activityPage();
    case "settings": return settingsPage();
    default:return teacherHome();
  }
}
function renderStudentRoute(){
  switch(route){
    case "studentWork": return studentWork();
    case "studentGrades": return studentGrades();
    case "take": return takeAssignment(routeData.id,routeData.page||0);
    case "classes": return classesPage();
    case "activity": return activityPage();
    case "settings": return settingsPage();
    default:return studentHome();
  }
}

function teacherHome(){
  const published=state.assignments.filter(a=>a.status==="published").length;
  const drafts=state.assignments.filter(a=>a.status==="draft").length;
  const pending=state.submissions.filter(s=>s.status==="submitted"&&!s.graded).length;
  return `
  <div class="panel"><div class="panelHead"><h1>Teacher Home</h1></div><div class="panelBody">
    <div class="grid3">
      <div class="stat"><strong>${published}</strong><span>Published assignments</span></div>
      <div class="stat"><strong>${drafts}</strong><span>Draft assignments</span></div>
      <div class="stat"><strong>${pending}</strong><span>Submissions to review</span></div>
    </div>
  </div></div>
  <div class="panel"><div class="panelHead"><h2>Quick Actions</h2></div><div class="panelBody">
    <div class="toolbar">
      <button class="btn primary" onclick="go('builder')">Create Assignment</button>
      <button class="btn" onclick="newUnit()">Create Unit</button>
      <button class="btn" onclick="newClass()">Create Class</button>
      <button class="btn" onclick="go('gradebook')">Open Gradebook</button>
    </div>
    <div class="info mb0"><strong>Share without a server:</strong> published assignments can generate a self-contained share link. Optional cloud sync can also be configured in Settings.</div>
  </div></div>
  ${upcomingTable(true)}
  ${recentActivity(6)}
  `;
}
function upcomingTable(teacher){
  const list=state.assignments.filter(a=>a.status==="published").sort((a,b)=>(a.dueAt||"9999").localeCompare(b.dueAt||"9999")).slice(0,8);
  return `<div class="panel"><div class="panelHead"><h2>${teacher?"Upcoming Work":"Upcoming Assignments"}</h2></div><div class="panelBody">${
    list.length?`<div class="tableWrap"><table><thead><tr><th>Assignment</th><th>Class / Unit</th><th>Due</th><th>Points</th><th>Status</th></tr></thead><tbody>${
      list.map(a=>`<tr><td><a href="#" onclick="${teacher?`go('builder',{id:'${a.id}'})`:`go('take',{id:'${a.id}',page:0})`};return false"><strong>${esc(a.title)}</strong></a></td><td>${esc(className(a.classId))}<br><span class="muted">${esc(unitName(a.unitId))}</span></td><td>${esc(fmtDate(a.dueAt))}</td><td>${a.points||sumPoints(a)}</td><td>${teacher?`<span class="pill blue">${esc(a.status)}</span>`:studentStatusPill(a)}</td></tr>`).join("")
    }</tbody></table></div>`:`<div class="empty">No published assignments.</div>`
  }</div></div>`;
}
function recentActivity(n=8){
  return `<div class="panel"><div class="panelHead"><h2>Recent Activity</h2></div><div class="panelBody">${
    state.activity.length?state.activity.slice(0,n).map(x=>`<div style="border-bottom:1px solid #ddd;padding:7px 0"><strong>${esc(x.text)}</strong><br><span class="muted">${fmtDate(x.time)}</span></div>`).join(""):"<div class='empty'>No activity yet.</div>"
  }</div></div>`;
}
function teacherAssignments(){
  const filter=routeData.filter||"all";
  let list=[...state.assignments];
  if(filter!=="all") list=list.filter(a=>a.status===filter);
  return `<div class="panel"><div class="panelHead"><h1>Assignments</h1></div><div class="panelBody">
    <div class="toolbar">
      <button class="btn primary" onclick="go('builder')">+ New Assignment</button>
      <button class="btn ${filter==="all"?"success":""}" onclick="go('assignments',{filter:'all'})">All</button>
      <button class="btn" onclick="go('assignments',{filter:'published'})">Published</button>
      <button class="btn" onclick="go('assignments',{filter:'draft'})">Drafts</button>
    </div>
    ${list.length?`<div class="tableWrap"><table><thead><tr><th>Title</th><th>Class</th><th>Unit</th><th>Due</th><th>Points</th><th>Status</th><th>Actions</th></tr></thead><tbody>${
      list.map(a=>`<tr>
      <td><strong>${esc(a.title)}</strong><br><span class="muted">Updated ${fmtDate(a.updatedAt)}</span></td>
      <td>${esc(className(a.classId))}</td><td>${esc(unitName(a.unitId))}</td><td>${esc(fmtDate(a.dueAt))}</td><td>${a.points||sumPoints(a)}</td>
      <td><span class="pill ${a.status==="published"?"green":"gold"}">${esc(a.status)}</span></td>
      <td>
        <button class="btn small" onclick="go('builder',{id:'${a.id}'})">Edit</button>
        <button class="btn small" onclick="duplicateAssignment('${a.id}')">Duplicate</button>
        <button class="btn small" onclick="shareAssignment('${a.id}')">Share</button>
        <button class="btn small danger" onclick="deleteAssignment('${a.id}')">Delete</button>
      </td></tr>`).join("")
    }</tbody></table></div>`:`<div class="empty">No assignments in this filter.</div>`}
  </div></div>`;
}

function assignmentBuilder(id){
  let a=id?state.assignments.find(x=>x.id===id):null;
  if(!a){
    a={
      id:uid("asn"),classId:state.classes[0]?.id||"",unitId:state.units[0]?.id||"",
      title:"Untitled Assignment",instructions:"",status:"draft",createdAt:nowISO(),updatedAt:nowISO(),dueAt:"",
      points:0,
      settings:{attempts:1,shuffleQuestions:false,shuffleChoices:false,releaseMode:"immediate",showCorrect:true,showFeedback:true,allowLate:true,tts:false,requireAll:true,timerMinutes:0,navigation:"sequential",studentNames:true},
      blocks:[]
    };
    state.assignments.push(a); routeData.id=a.id; logActivity("Created a new assignment draft.");
  }
  a.points=sumPoints(a);
  const classes=state.classes.filter(c=>!c.archived);

  return `
  <div class="panel"><div class="panelHead"><h1>Assignment Builder</h1><span class="pill ${a.status==="published"?"green":"gold"}">${esc(a.status)}</span></div><div class="panelBody">
    <div class="toolbar">
      <button class="btn primary" onclick="saveAssignmentMeta('${a.id}')">Save</button>
      <button class="btn success" onclick="publishAssignment('${a.id}')">${a.status==="published"?"Update Published":"Publish"}</button>
      <button class="btn" onclick="previewAssignment('${a.id}')">Student Preview</button>
      <button class="btn" onclick="shareAssignment('${a.id}')">Share Link</button>
      <button class="btn" onclick="openAssignmentSettings('${a.id}')">Assignment Settings</button>
    </div>
    <div class="grid2">
      <div class="formRow"><label>Assignment title</label><input id="a_title" type="text" value="${esc(a.title)}" oninput="builderAutoMeta('${a.id}')"></div>
      <div class="formRow"><label>Deadline</label><input id="a_due" type="datetime-local" value="${esc(a.dueAt||"")}" oninput="builderAutoMeta('${a.id}')"></div>
      <div class="formRow"><label>Class</label><select id="a_class" onchange="builderClassChanged('${a.id}')">${classes.map(c=>`<option value="${c.id}" ${a.classId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
      <div class="formRow"><label>Unit</label><select id="a_unit" onchange="builderAutoMeta('${a.id}')"><option value="">No unit</option>${units.map(u=>`<option value="${u.id}" ${a.unitId===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div>
    </div>
    <div class="formRow"><label>Directions / instructions</label><textarea id="a_instructions" oninput="builderAutoMeta('${a.id}')">${esc(a.instructions||"")}</textarea></div>
    <div class="builderTop">
      <div>
        <div class="toolbar">
          <strong>Add:</strong>
          <button class="btn small" onclick="addBlock('${a.id}','multiple')">Multiple Choice</button>
          <button class="btn small" onclick="addBlock('${a.id}','checkbox')">Checkbox</button>
          <button class="btn small" onclick="addBlock('${a.id}','short')">Short Written</button>
          <button class="btn small" onclick="addBlock('${a.id}','long')">Long Written</button>
          <button class="btn small" onclick="addBlock('${a.id}','reading')">Reading</button>
          <button class="btn small" onclick="addBlock('${a.id}','video')">Video + Question</button>
        </div>
        <div class="builderCanvas" id="builderCanvas">
          ${a.blocks.length?a.blocks.map((b,i)=>builderBlock(a,b,i)).join(""):`<div class="empty">This assignment is empty. Add a question, reading section, or video above.</div>`}
        </div>
      </div>
      <aside class="builderHelp">
        <strong>Assignment Summary</strong><hr>
        <div><strong>${a.blocks.length}</strong> pages / blocks</div>
        <div><strong>${sumPoints(a)}</strong> total points</div>
        <div><strong>${a.settings.attempts}</strong> attempt(s)</div>
        <div><strong>${a.settings.tts?"Enabled":"Disabled"}</strong> TTS</div>
        <hr>
        <div class="muted">Each content block appears on its own page in Student View. Written responses include a compact formatting toolbar.</div>
      </aside>

}
function builderBlock(a,b,i){
  const title={multiple:"Multiple Choice",checkbox:"Checkbox Response",short:"Short Written Response",long:"Long Written Response",reading:"Reading Section",video:"Video + Question"}[b.type]||b.type;
  let body="";
  if(["multiple","checkbox"].includes(b.type)){
    const choices=b.choices||["Option 1","Option 2"];
    body=`<div class="formRow"><label>Question</label><textarea oninput="updateBlock('${a.id}','${b.id}','prompt',this.value)">${esc(b.prompt||"")}</textarea></div>
    <label>${b.type==="multiple"?"Correct answer":"Correct answers"}</label>
    ${choices.map((c,idx)=>`<div class="optionRow">
      <input type="${b.type==="multiple"?"radio":"checkbox"}" name="ans_${b.id}" ${b.type==="multiple"?(b.answer===idx?"checked":""):((b.answers||[]).includes(idx)?"checked":"")} onchange="setCorrectChoice('${a.id}','${b.id}',${idx},this.checked)">
      <input type="text" value="${esc(c)}" oninput="updateChoice('${a.id}','${b.id}',${idx},this.value)">
      <button class="btn small danger" onclick="removeChoice('${a.id}','${b.id}',${idx})">Remove</button>
    </div>`).join("")}
    <button class="btn small" onclick="addChoice('${a.id}','${b.id}')">+ Add Choice</button>`;
  } else if(b.type==="short"||b.type==="long"){
    body=`<div class="formRow"><label>Prompt</label><textarea oninput="updateBlock('${a.id}','${b.id}','prompt',this.value)">${esc(b.prompt||"")}</textarea></div>
      <div class="formRow"><label>Teacher answer key / grading note</label><textarea oninput="updateBlock('${a.id}','${b.id}','teacherKey',this.value)">${esc(b.teacherKey||"")}</textarea><div class="hint">Written responses are marked for teacher review. This note is not shown until grading settings allow it.</div></div>`;
  } else if(b.type==="reading"){
    body=`<div class="formRow"><label>Reading title</label><input type="text" value="${esc(b.title||"Reading")}" oninput="updateBlock('${a.id}','${b.id}','title',this.value)"></div>
    <div class="formRow"><label>Reading passage</label><textarea style="min-height:180px" oninput="updateBlock('${a.id}','${b.id}','text',this.value)">${esc(b.text||"")}</textarea></div>`;
  } else if(b.type==="video"){
    body=`<div class="formRow"><label>Video URL</label><input type="url" value="${esc(b.url||"")}" placeholder="YouTube embed URL or direct MP4/WebM URL" oninput="updateBlock('${a.id}','${b.id}','url',this.value)"></div>
    <div class="formRow"><label>Question after video</label><textarea oninput="updateBlock('${a.id}','${b.id}','prompt',this.value)">${esc(b.prompt||"")}</textarea></div>
    <div class="formRow"><label>Answer key / note</label><textarea oninput="updateBlock('${a.id}','${b.id}','teacherKey',this.value)">${esc(b.teacherKey||"")}</textarea></div>`;
  }
  return `<div class="blockCard">
    <div class="blockCardHead"><span class="dragHandle">☰</span><strong>${i+1}. ${title}</strong>
      <button class="btn small" ${i===0?"disabled":""} onclick="moveBlock('${a.id}','${b.id}',-1)">Up</button>
      <button class="btn small" ${i===a.blocks.length-1?"disabled":""} onclick="moveBlock('${a.id}','${b.id}',1)">Down</button>
      <button class="btn small" onclick="duplicateBlock('${a.id}','${b.id}')">Copy</button>
      <button class="btn small danger" onclick="deleteBlock('${a.id}','${b.id}')">Delete</button>
    </div>
    <div class="blockCardBody">${body}
      ${b.type!=="reading"?`<div class="grid2 mt8"><div class="formRow"><label>Points</label><input type="number" min="0" max="1000" value="${Number(b.points||0)}" oninput="updateBlock('${a.id}','${b.id}','points',Number(this.value)||0)"></div><div class="formRow"><label><input type="checkbox" ${b.required!==false?"checked":""} onchange="updateBlock('${a.id}','${b.id}','required',this.checked)"> Required</label></div></div>`:""}
    </div>
  </div>`;
}
function findAssignment(id){return state.assignments.find(a=>a.id===id)}
function findBlock(aid,bid){const a=findAssignment(aid); return [a,a?.blocks.find(b=>b.id===bid)]}
function builderAutoMeta(id){
  const a=findAssignment(id); if(!a)return;
  a.title=document.getElementById("a_title")?.value||a.title;
  a.dueAt=document.getElementById("a_due")?.value||"";
  a.classId=document.getElementById("a_class")?.value||"";
  a.unitId=document.getElementById("a_unit")?.value||"";
  a.instructions=document.getElementById("a_instructions")?.value||"";
  a.updatedAt=nowISO(); scheduleSave();
}
function builderClassChanged(id){
  builderAutoMeta(id);
  const a=findAssignment(id); if(a)a.unitId="";
  render();
}
function saveAssignmentMeta(id){builderAutoMeta(id); saveState(); toast("Assignment saved.");}
function addBlock(aid,type){
  builderAutoMeta(aid);
  const a=findAssignment(aid); if(!a)return;
  let b={id:uid("b"),type,points:type==="reading"?0:1,required:type!=="reading"};
  if(type==="multiple")Object.assign(b,{prompt:"",choices:["Option 1","Option 2","Option 3","Option 4"],answer:0});
  if(type==="checkbox")Object.assign(b,{prompt:"",choices:["Option 1","Option 2","Option 3","Option 4"],answers:[0]});
  if(type==="short"||type==="long")Object.assign(b,{prompt:"",teacherKey:""});
  if(type==="reading")Object.assign(b,{title:"Reading",text:""});
  if(type==="video")Object.assign(b,{url:"",prompt:"",teacherKey:""});
  a.blocks.push(b);a.updatedAt=nowISO();scheduleSave();render();
}
function updateBlock(aid,bid,key,val){
  const [a,b]=findBlock(aid,bid); if(!b)return;b[key]=val;a.updatedAt=nowISO();a.points=sumPoints(a);scheduleSave();
}
function updateChoice(aid,bid,idx,val){const [a,b]=findBlock(aid,bid);if(!b)return;b.choices[idx]=val;a.updatedAt=nowISO();scheduleSave();}
function addChoice(aid,bid){const [a,b]=findBlock(aid,bid);if(!b)return;b.choices.push("New option");scheduleSave();render();}
function removeChoice(aid,bid,idx){const [a,b]=findBlock(aid,bid);if(!b||b.choices.length<=2)return toast("Keep at least two choices.");b.choices.splice(idx,1);if(b.type==="multiple")b.answer=0;else b.answers=(b.answers||[]).filter(x=>x!==idx).map(x=>x>idx?x-1:x);scheduleSave();render();}
function setCorrectChoice(aid,bid,idx,checked){
  const [a,b]=findBlock(aid,bid);if(!b)return;
  if(b.type==="multiple") b.answer=idx;
  else {const set=new Set(b.answers||[]);checked?set.add(idx):set.delete(idx);b.answers=[...set].sort((x,y)=>x-y);}
  scheduleSave();
}
function deleteBlock(aid,bid){const a=findAssignment(aid);if(!a)return;a.blocks=a.blocks.filter(b=>b.id!==bid);scheduleSave();render();}
function duplicateBlock(aid,bid){const [a,b]=findBlock(aid,bid);if(!b)return;const copy=JSON.parse(JSON.stringify(b));copy.id=uid("b");const i=a.blocks.findIndex(x=>x.id===bid);a.blocks.splice(i+1,0,copy);scheduleSave();render();}
function moveBlock(aid,bid,dir){const a=findAssignment(aid);const i=a.blocks.findIndex(b=>b.id===bid);const j=i+dir;if(i<0||j<0||j>=a.blocks.length)return;[a.blocks[i],a.blocks[j]]=[a.blocks[j],a.blocks[i]];scheduleSave();render();}
function sumPoints(a){return (a.blocks||[]).reduce((s,b)=>s+(Number(b.points)||0),0)}
function publishAssignment(id){
  builderAutoMeta(id);const a=findAssignment(id); if(!a)return;
  if(!a.title.trim())return toast("Add an assignment title.");
  if(!a.blocks.length)return toast("Add at least one page or question.");
  a.status="published";a.points=sumPoints(a);a.updatedAt=nowISO();
  logActivity(`Published assignment: ${a.title}`);saveState();render();toast("Assignment published.");
}
function duplicateAssignment(id){
  const a=findAssignment(id);if(!a)return;
  const c=JSON.parse(JSON.stringify(a));c.id=uid("asn");c.title=a.title+" (Copy)";c.status="draft";c.createdAt=nowISO();c.updatedAt=nowISO();c.blocks.forEach(b=>b.id=uid("b"));
  state.assignments.push(c);logActivity(`Duplicated assignment: ${a.title}`);saveState();render();
}
function deleteAssignment(id){
  const a=findAssignment(id);if(!a)return;
  if(state.settings.confirmDelete&&!confirm(`Delete "${a.title}"? This cannot be undone.`))return;
  state.assignments=state.assignments.filter(x=>x.id!==id);state.submissions=state.submissions.filter(s=>s.assignmentId!==id);
  logActivity(`Deleted assignment: ${a.title}`);saveState();go("assignments");
}
function openAssignmentSettings(id){
  const a=findAssignment(id);if(!a)return;
  showModal("Assignment Settings",`
    <div class="grid2">
      <div class="formRow"><label>Attempts allowed</label><input id="s_attempts" type="number" min="1" max="20" value="${a.settings.attempts||1}"></div>
      <div class="formRow"><label>Timer (minutes; 0 = off)</label><input id="s_timer" type="number" min="0" max="999" value="${a.settings.timerMinutes||0}"></div>
      <div class="formRow"><label>Grade release</label><select id="s_release"><option value="immediate" ${a.settings.releaseMode==="immediate"?"selected":""}>Immediately after submit</option><option value="teacher" ${a.settings.releaseMode==="teacher"?"selected":""}>When teacher releases</option><option value="manual" ${a.settings.releaseMode==="manual"?"selected":""}>Manual review only</option></select></div>
      <div class="formRow"><label>Navigation</label><select id="s_nav"><option value="sequential" ${a.settings.navigation==="sequential"?"selected":""}>Next / Previous pages</option><option value="forward" ${a.settings.navigation==="forward"?"selected":""}>Forward only</option></select></div>
    </div>
    <hr>
    ${settingCheck("s_tts","Text-to-speech controls for students",a.settings.tts)}
    ${settingCheck("s_correct","Show correct answers after grade release",a.settings.showCorrect)}
    ${settingCheck("s_feedback","Show teacher feedback to students",a.settings.showFeedback)}
    ${settingCheck("s_late","Allow submissions after deadline",a.settings.allowLate)}
    ${settingCheck("s_required","Require all required questions before submission",a.settings.requireAll)}
    ${settingCheck("s_sq","Shuffle question order for each attempt",a.settings.shuffleQuestions)}
    ${settingCheck("s_sc","Shuffle multiple-choice options",a.settings.shuffleChoices)}
  `,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAssignmentSettings('${id}')">Save Settings</button>`);
}
function settingCheck(id,label,on){return `<div class="formRow"><label style="font-weight:normal"><input id="${id}" type="checkbox" ${on?"checked":""}> ${label}</label></div>`}
function saveAssignmentSettings(id){
  const a=findAssignment(id);if(!a)return;
  Object.assign(a.settings,{
    attempts:clamp(Number(document.getElementById("s_attempts").value)||1,1,20),
    timerMinutes:Math.max(0,Number(document.getElementById("s_timer").value)||0),
    releaseMode:document.getElementById("s_release").value,
    navigation:document.getElementById("s_nav").value,
    tts:document.getElementById("s_tts").checked,
    showCorrect:document.getElementById("s_correct").checked,
    showFeedback:document.getElementById("s_feedback").checked,
    allowLate:document.getElementById("s_late").checked,
    requireAll:document.getElementById("s_required").checked,
    shuffleQuestions:document.getElementById("s_sq").checked,
    shuffleChoices:document.getElementById("s_sc").checked
  });
  a.updatedAt=nowISO();scheduleSave();closeModal();render();toast("Assignment settings saved.");
}
function previewAssignment(id){closeModal();setRole("student");go("take",{id,page:0,preview:true});}

function shareAssignment(id){
  const a=findAssignment(id);if(!a)return;
  const packet={v:VERSION,type:"classtask-assignment",assignment:a,classInfo:state.classes.find(c=>c.id===a.classId)||null,unitInfo:state.units.find(u=>u.id===a.unitId)||null};
  const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(packet))));
  const base=location.href.split("#")[0];
  const link=base+"#share="+encoded;
  showModal("Share Assignment",`
    <div class="successBox"><strong>Server-free share link ready.</strong> The assignment data is packed into the URL so another copy of this page can import it.</div>
    <div class="formRow"><label>Share link</label><textarea id="shareLink" readonly>${esc(link)}</textarea></div>
    <div class="toolbar"><button class="btn primary" onclick="copyShareLink()">Copy Link</button><button class="btn" onclick="cloudPublish('${id}')">Publish to Configured Cloud</button></div>
    <div class="muted">Very large assignments may create long URLs. For permanent short public links, configure the optional cloud adapter in Settings.</div>
  `,`<button class="btn" onclick="closeModal()">Done</button>`);
}
async function copyShareLink(){
  const el=document.getElementById("shareLink"); el.select();
  try{await navigator.clipboard.writeText(el.value);toast("Share link copied.");}catch(e){document.execCommand("copy");toast("Share link copied.");}
}
function importHashShare(){
  if(!location.hash.startsWith("#share="))return;
  try{
    const raw=decodeURIComponent(escape(atob(location.hash.slice(7))));
    const packet=JSON.parse(raw);
    if(packet.type!=="classtask-assignment")return;
    const a=packet.assignment;
    const existing=state.assignments.find(x=>x.id===a.id);
    if(!existing) state.assignments.push(a);
    else Object.assign(existing,a);
    if(packet.classInfo&&!state.classes.some(c=>c.id===packet.classInfo.id))state.classes.push(packet.classInfo);
    if(packet.unitInfo&&!state.units.some(u=>u.id===packet.unitInfo.id))state.units.push(packet.unitInfo);
    state.role="student";saveState();route="take";routeData={id:a.id,page:0};
    history.replaceState(null,"",location.href.split("#")[0]);
    setTimeout(()=>toast("Shared assignment imported."),250);
  }catch(e){console.warn("Invalid share link",e)}
}

      state.units.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td>${esc(className(u.classId))}</td><td>${esc(u.description||"")}</td><td>${state.assignments.filter(a=>a.unitId===u.id).length}</td><td><button class="btn small" onclick="editUnit('${u.id}')">Edit</button> <button class="btn small danger" onclick="deleteUnit('${u.id}')">Delete</button></td></tr>`).join("")

function newUnit(){editUnit(null)}
function editUnit(id){
  const u=id?state.units.find(x=>x.id===id):{id:"",classId:state.classes[0]?.id||"",name:"",description:""};
  showModal(id?"Edit Unit":"Create Unit",`
    <div class="formRow"><label>Unit name</label><input id="unit_name" value="${esc(u.name)}"></div>
    <div class="formRow"><label>Class</label><select id="unit_class">${state.classes.map(c=>`<option value="${c.id}" ${u.classId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
    <div class="formRow"><label>Description</label><textarea id="unit_desc">${esc(u.description)}</textarea></div>`,

function saveUnit(id){
  const name=document.getElementById("unit_name").value.trim();if(!name)return toast("Enter a unit name.");
  if(id){const u=state.units.find(x=>x.id===id);u.name=name;u.classId=document.getElementById("unit_class").value;u.description=document.getElementById("unit_desc").value;}
  else state.units.push({id:uid("unit"),name,classId:document.getElementById("unit_class").value,description:document.getElementById("unit_desc").value,order:state.units.length+1});

function deleteUnit(id){if(!confirm("Delete this unit? Assignments will be moved to No unit."))return;state.units=state.units.filter(u=>u.id!==id);state.assignments.forEach(a=>{if(a.unitId===id)a.unitId=""});saveState();render();}

function newClass(){editClass(null)}
function editClass(id){

    <div class="formRow"><label>Class name</label><input id="class_name" value="${esc(c.name)}"></div>

function saveClass(id){

function gradebook(){
  const subs=state.submissions.filter(s=>s.status==="submitted");
  return `<div class="panel"><div class="panelHead"><h1>Gradebook</h1></div><div class="panelBody">
    ${subs.length?`<div class="tableWrap"><table><thead><tr><th>Student</th><th>Assignment</th><th>Submitted</th><th>Auto Score</th><th>Final Grade</th><th>Status</th><th></th></tr></thead><tbody>${
      subs.map(s=>{const a=findAssignment(s.assignmentId);return `<tr><td>${esc(s.studentName)}</td><td>${esc(a?.title||"Deleted assignment")}</td><td>${fmtDate(s.submittedAt)}</td><td>${s.autoScore}/${s.totalPoints}</td><td>${s.graded?`${s.finalScore}/${s.totalPoints}`:"—"}</td><td><span class="pill ${s.graded?"green":"gold"}">${s.graded?"Graded":"Needs review"}</span></td><td><button class="btn small" onclick="go('submission',{id:'${s.id}'})">Review</button></td></tr>`}).join("")
    }</tbody></table></div>`:`<div class="empty">No student submissions yet. Switch to Student View and submit the demo assignment to test the grading workflow.</div>`}

function studentBlock(a,s,b){
  const val=s.responses[b.id];
  if(b.type==="reading")return `<h2>${esc(b.title||"Reading")}</h2><div class="readingBox">${esc(b.text||"")}</div>`;
  if(b.type==="multiple")return `<div class="questionPrompt">${esc(b.prompt||"Question")}</div><div class="choiceList">${(b.choices||[]).map((c,i)=>`<label class="choiceLine"><input type="radio" name="resp_${b.id}" value="${i}" ${Number(val)===i?"checked":""}> <span>${esc(c)}</span></label>`).join("")}</div>`;
  if(b.type==="checkbox")return `<div class="questionPrompt">${esc(b.prompt||"Select all that apply.")}</div><div class="choiceList">${(b.choices||[]).map((c,i)=>`<label class="choiceLine"><input type="checkbox" name="resp_${b.id}" value="${i}" ${Array.isArray(val)&&val.includes(i)?"checked":""}> <span>${esc(c)}</span></label>`).join("")}</div>`;
  if(b.type==="short")return `<div class="questionPrompt">${esc(b.prompt||"Short response")}</div>${richEditor(b.id,val||"",false)}`;
  if(b.type==="long")return `<div class="questionPrompt">${esc(b.prompt||"Written response")}</div>${richEditor(b.id,val||"",true)}`;
  if(b.type==="video")return `<div class="videoBox">${videoEmbed(b.url)}</div><div class="questionPrompt" style="margin-top:15px">${esc(b.prompt||"Respond after viewing the video.")}</div>${richEditor(b.id,val||"",true)}`;
  return `<div class="error">Unknown content type.</div>`;
}
function videoEmbed(url){
  if(!url)return `<div style="padding:100px 10px;color:#ccc">No video URL was supplied.</div>`;
  let u=url.trim();
  if(/youtube\.com\/watch\?v=/.test(u)){const id=new URL(u).searchParams.get("v");u=`https://www.youtube.com/embed/${encodeURIComponent(id)}`;}
  if(/youtu\.be\//.test(u)){const id=u.split("youtu.be/")[1].split(/[?&]/)[0];u=`https://www.youtube.com/embed/${encodeURIComponent(id)}`;}
  if(/youtube\.com\/embed\//.test(u))return `<iframe src="${esc(u)}" allowfullscreen title="Assignment video"></iframe>`;
  return `<video controls src="${esc(u)}">Your browser cannot play this video.</video>`;
}
function richEditor(id,val,long){

    <button type="button" onclick="richCmd('italic')" title="Italic"><i>I</i></button>

function richCmd(cmd){document.execCommand(cmd,false,null)}
function captureResponse(a,b,s){
  if(b.type==="reading")return;
  if(b.type==="multiple"){

  }else if(b.type==="checkbox"){
    s.responses[b.id]=[...document.querySelectorAll(`input[name="resp_${b.id}"]:checked`)].map(x=>Number(x.value));
  }else{
    const el=document.getElementById("rich_"+b.id);s.responses[b.id]=el?el.innerHTML:"";
  }
  scheduleSave();
}
function saveResponseAndGo(aid,page){

function answerPresent(b,r){
  if(b.type==="reading")return true;
  if(b.type==="checkbox")return Array.isArray(r)&&r.length>0;
  if(b.type==="multiple")return Number.isInteger(r);
  return strip(r||"").trim().length>0;
}
function submitAssignment(aid){
  const a=findAssignment(aid),s=ensureDraftSubmission(a),b=a.blocks[routeData.page||0];captureResponse(a,b,s);
  if(a.settings.requireAll){
    const missing=a.blocks.filter(b=>b.required!==false&&b.type!=="reading"&&!answerPresent(b,s.responses[b.id]));
    if(missing.length)return toast(`Please answer ${missing.length} required question(s) before submitting.`);
  }
  if(a.dueAt&&!a.settings.allowLate&&new Date(a.dueAt)<new Date())return toast("This assignment no longer accepts late submissions.");
  s.status="submitted";s.submittedAt=nowISO();s.totalPoints=sumPoints(a);
  s.autoScore=a.blocks.reduce((sum,b)=>sum+autoBlockScore(b,s.responses[b.id]),0);
  const written=a.blocks.some(b=>["short","long","video"].includes(b.type));
  if(!written&&a.settings.releaseMode==="immediate"){s.graded=true;s.finalScore=s.autoScore;s.released=true;s.gradedAt=nowISO();}
  else if(a.settings.releaseMode==="immediate"){s.released=true;}
  logActivity(`${s.studentName} submitted: ${a.title}`);saveState();render();toast("Assignment submitted.");
}
function autoBlockScore(b,r){
  const pts=Number(b.points)||0;
  if(b.type==="multiple")return Number(r)===Number(b.answer)?pts:0;
  if(b.type==="checkbox"){
    const a=[...(b.answers||[])].sort((x,y)=>x-y),v=[...(Array.isArray(r)?r:[])].sort((x,y)=>x-y);
    return JSON.stringify(a)===JSON.stringify(v)?pts:0;
  }
  if(b.type==="reading")return 0;
  return 0;
}

function saveCloudSettings(){

async function cloudRequest(path,options={}){
  const c=state.cloud;
  if(!c.projectUrl||!c.anonKey)throw new Error("Configure the cloud project URL and public key first.");
  const headers=Object.assign({"apikey":c.anonKey,"Authorization":"Bearer "+c.anonKey,"Content-Type":"application/json","Accept":"application/json"},options.headers||{});
  const res=await fetch(c.projectUrl+"/rest/v1/"+path,Object.assign({},options,{headers}));
  if(!res.ok)throw new Error(`Cloud request failed (${res.status}): ${await res.text()}`);
  const txt=await res.text();return txt?JSON.parse(txt):null;
}
async function testCloud(){
  saveCloudSettings();
  try{await cloudRequest(`${state.cloud.table}?select=id&limit=1`);toast("Cloud connection succeeded.");}
  catch(e){showModal("Cloud Test",`<div class="error">${esc(e.message)}</div><div class="muted">Make sure the table exists and its read policy permits the public key.</div>`,`<button class="btn" onclick="closeModal()">Close</button>`)}
}
async function cloudPublish(id){
  const a=findAssignment(id);if(!a)return;
  try{
    const payload={id:a.id,updated_at:nowISO(),payload:{assignment:a,classInfo:state.classes.find(c=>c.id===a.classId)||null,unitInfo:state.units.find(u=>u.id===a.unitId)||null}};
    await cloudRequest(state.cloud.table,{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=representation"},body:JSON.stringify(payload)});
    const link=location.href.split("#")[0]+"#cloud="+encodeURIComponent(a.id);
    const ta=document.getElementById("shareLink");if(ta)ta.value=link;
    toast("Assignment published to configured cloud.");
  }catch(e){showModal("Cloud Publish Error",`<div class="error">${esc(e.message)}</div><div class="muted">This prototype does not include or expose a private service key. Configure database policies that are appropriate for classroom/public-share use.</div>`,`<button class="btn" onclick="closeModal()">Close</button>`)}
}
async function importCloudHash(){
  if(!location.hash.startsWith("#cloud="))return;
  const id=decodeURIComponent(location.hash.slice(7));
  try{
    const rows=await cloudRequest(`${state.cloud.table}?id=eq.${encodeURIComponent(id)}&select=payload`);
    const p=rows?.[0]?.payload;if(!p?.assignment)throw new Error("Shared assignment not found.");
    if(!state.assignments.some(a=>a.id===p.assignment.id))state.assignments.push(p.assignment);
    if(p.classInfo&&!state.classes.some(c=>c.id===p.classInfo.id))state.classes.push(p.classInfo);
    if(p.unitInfo&&!state.units.some(u=>u.id===p.unitInfo.id))state.units.push(p.unitInfo);
    state.role="student";saveState();history.replaceState(null,"",location.href.split("#")[0]);go("take",{id:p.assignment.id,page:0});
  }catch(e){showModal("Cloud Share Error",`<div class="error">${esc(e.message)}</div>`,`<button class="btn" onclick="closeModal()">Close</button>`)}
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="classtask-v0.1.0-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{state=JSON.parse(r.result);saveState();render();toast("Backup imported.");}catch(e){toast("That file is not a valid backup.");}};
  r.readAsText(file);
}
function resetDemo(){if(!confirm("Reset all local ClassTask data to the v0.1.0 demo?"))return;localStorage.removeItem(STORE_KEY);state=seedState();saveState();route="dashboard";render();}
function className(id){return state.classes.find(c=>c.id===id)?.name||"No class"}
function unitName(id){return state.units.find(u=>u.id===id)?.name||"No unit"}

function showModal(title,body,foot=`<button class="btn" onclick="closeModal()">Close</button>`){
  document.getElementById("modalRoot").innerHTML=`<div class="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalTitle">${esc(title)}</div><div class="modalBody">${body}</div><div class="modalFoot">${foot}</div></div></div>`;
}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function showLegal(type){
  const terms=`<h3>Educational Prototype Terms</h3><p>ClassTask v${VERSION} is a browser-based educational prototype. Teachers are responsible for assignment content, student instructions, grading decisions, and any external service they connect.</p><p>Do not place passwords, private service keys, regulated student records, or other sensitive information into public share links.</p><p>This demo is provided as-is for development and educational testing.</p>`;
  const privacy=`<h3>Privacy</h3><p>By default, this build stores classes, assignments, drafts, submissions, and settings in your browser using localStorage. The server-free share feature places assignment content inside the URL itself.</p><p>Data is sent over the network only when you deliberately configure and use the optional cloud REST adapter or load an embedded external video.</p><p>Before real classroom deployment, add authentication, access controls, a school-approved privacy policy, and compliant data retention practices.</p>`;
  showModal(type==="terms"?"Terms of Service":"Privacy Policy",type==="terms"?terms:privacy);
}
function showAbout(){showModal("About ClassTask",`<p><strong>ClassTask v${VERSION}</strong></p><p>A deliberately old-fashioned 2014–2015 style assignment builder with teacher and student views, autosave, units, assignments, page-by-page activities, written-response editors, TTS support, grading, and sharing.</p>`)}
function bindDynamic(){}
function setCloudSettingsFromCache(){
  try{const c=JSON.parse(localStorage.getItem(CLOUD_KEY)||"null");if(c)state.cloud=Object.assign(state.cloud,c)}catch(e){}
}

window.addEventListener("beforeunload",()=>saveState());
importHashShare();
render();
if(location.hash.startsWith("#cloud="))setTimeout(importCloudHash,0);
</script>
</body>
